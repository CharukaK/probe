[package]
name = "tree-sitter-http"
description = "Parser for HTTP syntax specified in https://datatracker.ietf.org/doc/html/rfc9110"
version = "0.1.0"
authors = ["Charuka Karunanayake <charukakarunanayake@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "http"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/charukak/probe"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
